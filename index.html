<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TahaHub</title>
<style>
:root{--a:#00e5ff;--ink:#001417;--c:#262626}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
input,textarea,select{background:var(--c);border:1px solid #333;border-radius:8px;padding:10px;min-width:0}
.strip{background:#0a0a0a;display:flex;justify-content:flex-end;gap:6px;padding:5px 20px}
.strip button{background:none;border:0;color:#8a8a8a;font-size:12px;font-weight:700}.strip .on{color:var(--a)}
.head{background:#141414;border-bottom:1px solid #1f1f1f}.w{max-width:1510px;margin:auto;padding:0 20px}
.top{display:flex;align-items:center;gap:16px;padding:10px 0 6px}
.logo{font-size:36px;font-weight:700;letter-spacing:-1px;cursor:pointer;white-space:nowrap}
.logo b{background:var(--a);color:var(--ink);padding:0 7px 2px;border-radius:6px;margin-left:4px}
.search{flex:1;max-width:640px;background:var(--c);border-radius:30px;height:46px;display:flex;align-items:center;padding:0 18px}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
#me{margin-left:auto;display:flex;align-items:center;gap:10px;background:none;border:0}
.av{width:42px;height:42px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;font-size:22px}
.tabs{display:flex;overflow-x:auto}.tabs a{flex:1;min-width:110px;text-align:center;padding:15px 10px;font-weight:700;font-size:12px;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs a.on{border-color:var(--a);color:var(--a)}
h2{font-size:23px;margin:18px 0 14px}
.chips{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto}
.chips button{background:#111;border:2px solid #262626;border-radius:30px;padding:11px 22px;font-weight:700;white-space:nowrap}
.chips .on{border-color:var(--a);color:var(--a)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{background:#111;border-radius:4px;overflow:hidden;cursor:pointer}.card:hover{outline:2px solid var(--a)}
.th{position:relative;height:220px;background:#000}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(0,229,255,.9);color:var(--ink);display:grid;place-items:center;font-style:normal}
.in{padding:10px 12px}.in b{display:block;font-size:15px}.in small{color:#aaa}.em{color:#888;padding:30px 0}
.hero{position:relative;height:calc(100vh - 150px);min-height:340px;overflow:hidden;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1.4s}
.hero img.on{opacity:1;transform:scale(1.14);transition:opacity 1.4s,transform 6s linear}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.ov h1{font-size:clamp(32px,6vw,72px);margin:0;text-shadow:0 2px 20px #000;text-align:center;padding:0 16px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:9;padding:10px}
.bx{position:relative;background:#141414;border-radius:8px;display:grid;grid-template-columns:2fr 1fr;width:min(1200px,100%);max-height:92vh;overflow:hidden}
.md1{background:#000;display:grid;place-items:center}.md1 img,.md1 video{max-width:100%;max-height:92vh}
.md2{padding:14px;display:flex;flex-direction:column;gap:8px;max-height:92vh;min-height:0}.md2 h3,.md2 h4{margin:0}
.cl{flex:1;overflow:auto;display:flex;flex-direction:column-reverse;gap:8px;min-height:120px}
.cm{background:#1f1f1f;padding:8px 10px;border-radius:8px;font-size:14px;word-break:break-word}.cm b{display:block;color:var(--a);font-size:12px}
.x{position:absolute;right:8px;top:8px;z-index:2;background:#000a;border:0;border-radius:50%;width:34px;height:34px}
.sd,#cs{background:var(--a);color:var(--ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pv img,.pv video{width:100%;max-height:62vh;object-fit:contain;background:#000}
.ch{display:flex;flex-direction:column;gap:8px;height:62vh}.row{display:flex;gap:6px}.row input{flex:1}
.dl{background:none;border:1px solid #444;border-radius:8px;padding:8px;font-size:13px;color:#ccc}
.dg{background:#141414;border-radius:8px;padding:18px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
footer a{color:var(--a);cursor:pointer}
footer{margin-top:40px;padding:22px;color:#8a8a8a;font-size:13px;text-align:center;background:#141414}
@media(max-width:800px){.bx,.cr{grid-template-columns:1fr}.bx{overflow:auto}.md1 img,.md1 video{max-height:50vh}.ch{height:50vh}.logo{font-size:28px}.search{height:40px}.top{flex-wrap:wrap}.search{order:5;flex:1 1 100%;max-width:none}#me span{display:none}.hero{height:calc(100vh - 200px)}}
</style></head><body>
<div class="strip"><button data-l="tr">TR</button><button data-l="en">EN</button></div>
<div class="head"><div class="w"><div class="top"><a class="logo" id="logo">Taha<b>Hub</b></a>
<div class="search">🔍<input id="q" autocomplete="off"></div><button id="me"><span></span><div class="av">👤</div></button></div>
<div class="tabs"><a data-r="home"></a><a data-r="videos"></a><a data-r="photos"></a><a data-r="cats"></a><a data-r="chat"></a><a data-r="req"></a><a data-r="up"></a></div></div></div>
<div id="app"></div>
<footer><a id="dr"></a> · © 2026 TahaHub</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,addDoc,doc,setDoc,getDocs,onSnapshot,query,orderBy,limit,serverTimestamp,increment}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyASRnIXD1nhwCHQks00r2gauBcMJtAzcEc",authDomain:"tahahub-49076.firebaseapp.com",projectId:"tahahub-49076",storageBucket:"tahahub-49076.firebasestorage.app",messagingSenderId:"480771554265",appId:"1:480771554265:web:11f02ba742808c740ab7c8"}));

/* ===== AYARLAR ===== */
const dir=n=>n>=63&&n<=67?"ekip2/":n==68?"":"ekip/";   // fotoğrafların klasörü
const CLOUD="s9pc6tzt",PRESET="tahahub";   // Cloudinary ayarları
const N=71;                          // foto1 ... foto71
const TITLES={};                     // özel başlık: {5:"Sınıf gezisi", 12:"Okul bahçesi"}
const VN=1;                          // video sayısı: video1.mp4 ... videoN.mp4
const VP="hıyar.jpg";                // videoların kapak fotoğrafı
const VT={};                         // özel başlık: {1:"Sınıf gezisi"}
const VIDEOS=[...Array(VN)].map((_,i)=>({f:`video${i+1}.mp4`,p:VP,t:VT[i+1]||"Video "+(i+1)}));
/* =================== */

const T={tr:{home:"Ana Sayfa",videos:"Videolar",photos:"Fotoğraflar",cats:"Kategoriler",chat:"Topluluk",req:"Talepler",up:"Yükle",kind:"Ne yüklüyorsun?",photo:"Fotoğraf",video:"Video",cat:"Kategori",ctitle:"Başlık (isteğe bağlı)",upbtn:"Yükle",toobig:"Dosya çok büyük (fotoğraf en fazla 10 MB, video en fazla 100 MB).",wrong:"Seçtiğin tür dosyayla uyuşmuyor.",done:"Yüklendi! Sitede görünüyor.",fail:"Yükleme başarısız oldu.",search:"TahaHub'da ara",welcome:"Hoş geldin",rec:"Önerilenler",all:"Tümü",new:"Yeni Eklenenler",top:"En Çok İzlenen",dik:"Dik",yatay:"Yatay",normal:"Normal",views:"izlenme",cmt:"Yorumlar",name:"Adın",write:"Yorum yaz...",send:"Gönder",none:"Sonuç yok",pick:"Fotoğraf veya video seç",msg:"Mesaj yaz...",guest:"Misafir",ask:"Adın ne?",ph:"Fotoğraf ",del:"Silme talebi",why:"Neden silinmesini istiyorsun?",sent:"Talebin gönderildi, teşekkürler."},
en:{home:"Home",videos:"Videos",photos:"Photos",cats:"Categories",chat:"Community",req:"Requests",up:"Upload",kind:"What are you uploading?",photo:"Photo",video:"Video",cat:"Category",ctitle:"Title (optional)",upbtn:"Upload",toobig:"File too large (photo max 10 MB, video max 100 MB).",wrong:"The chosen type does not match the file.",done:"Uploaded! It is now on the site.",fail:"Upload failed.",search:"Search TahaHub",welcome:"Welcome",rec:"Recommended",all:"All",new:"Newly Added",top:"Most Viewed",dik:"Portrait",yatay:"Landscape",normal:"Standard",views:"views",cmt:"Comments",name:"Your name",write:"Write a comment...",send:"Send",none:"No results",pick:"Pick a photo or video",msg:"Write a message...",guest:"Guest",ask:"What's your name?",ph:"Photo ",del:"Request removal",why:"Why should it be removed?",sent:"Request sent, thank you."}};
const $=s=>document.querySelector(s),L=()=>localStorage.l||"tr",t=k=>T[L()][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let route="home",flt="all",cat="dik",q="",room="",me=localStorage.me||"",views={},tm,cu=()=>{};
const base=[...Array(N)].map((_,i)=>({id:"p"+(i+1),type:"p",n:i+1,src:`${dir(i+1)}foto${i+1}.jpg.jpeg`,t:TITLES[i+1]})).concat(VIDEOS.map((v,i)=>({id:"v"+(i+1),type:"v",n:i+1,src:v.f,poster:v.p,t:v.t})));
let ups=[],items,ph,vd;const rebuild=()=>{items=base.concat(ups);ph=items.filter(x=>x.type=="p");vd=items.filter(x=>x.type=="v")};rebuild();
const ti=x=>x.t||t("ph")+x.n,vw=x=>(views[x.id]||0)+" "+t("views");
ph.forEach(x=>{const im=new Image();im.onload=()=>{const r=im.width/im.height;x.o=r<.9?"dik":r>1.2?"yatay":"normal";if(route=="cats"&&!q)render()};im.src=x.src});
const card=x=>`<div class="card" data-id="${x.id}"><div class="th"><img loading="lazy" src="${x.type=="p"?x.src:x.poster}" alt="">${x.type=="v"?"<i>▶</i>":""}</div><div class="in"><b>${esc(ti(x))}</b><small>${vw(x)}</small></div></div>`;
const grid=a=>a.length?`<div class="g">${a.map(card).join("")}</div>`:`<p class="em">${t("none")}</p>`;
const chips=(l,c,a)=>`<div class="chips">${l.map(k=>`<button class="${k==c?"on":""}" data-${a}="${k}">${t(k)}</button>`).join("")}</div>`;
const media=x=>x.type=="p"?`<img src="${x.src}" alt="">`:`<video src="${x.src}" poster="${x.poster||""}" controls playsinline></video>`;
function setMe(n){me=n.trim().slice(0,30);localStorage.me=me;$("#me span").textContent=me||t("guest")}
function msg(d){const e=document.createElement("div");e.className="cm";const b=document.createElement("b"),p=document.createElement("span");b.textContent=d.name;p.textContent=d.text;e.append(b,p);return e}
const live=(el,p)=>onSnapshot(query(collection(db,...p),orderBy("ts","desc"),limit(80)),s=>{el.textContent="";s.forEach(d=>el.appendChild(msg(d.data())))});
function post(p,n,tx){n=n.trim();tx=tx.trim();if(!n||!tx)return false;setMe(n);addDoc(collection(db,...p),{name:n,text:tx,ts:serverTimestamp()});return true}
function show(){const a=ph.map(x=>x.src).sort(()=>Math.random()-.5),s=[$("#s1"),$("#s2")];let i=0,k=0;const go=()=>{const e=s[k%2],o=s[(k+1)%2];k++;e.onload=()=>{e.classList.add("on");o.classList.remove("on")};e.src=a[i++%a.length]};go();tm=setInterval(go,4000)}
function render(){
clearInterval(tm);cu();cu=()=>{};
document.querySelectorAll(".tabs a").forEach(a=>{a.textContent=t(a.dataset.r);a.classList.toggle("on",a.dataset.r==route&&!q)});
document.querySelectorAll(".strip button").forEach(b=>b.classList.toggle("on",b.dataset.l==L()));
$("#q").placeholder=t("search");$("#dr").textContent=t("del");$("#me span").textContent=me||t("guest");document.documentElement.lang=L();
let h="";
if(q){const s=q.toLowerCase();h=`<div class="w">${grid(items.filter(x=>(ti(x)+" "+x.src).toLowerCase().includes(s)))}</div>`}
else if(route=="home")h=`<div class="hero"><img id="s1" alt=""><img id="s2" alt=""><div class="ov"><h1>${t("welcome")}${me?", "+esc(me):""}!</h1></div></div>`;
else if(route=="videos"){let a=[...vd];if(flt=="new")a.reverse();if(flt=="top")a.sort((x,y)=>(views[y.id]||0)-(views[x.id]||0));h=`<div class="w"><h2>${t("rec")}</h2>${chips(["all","new","top"],flt,"f")}${grid(a)}</div>`}
else if(route=="photos")h=`<div class="w"><h2>${t("photos")}</h2>${grid(ph)}</div>`;
else if(route=="cats")h=`<div class="w"><h2>${t("cats")}</h2>${chips(["dik","yatay","normal"],cat,"c")}${grid(items.filter(x=>x.o==cat))}</div>`;
else if(route=="req"||route=="up")h="";
else h=`<div class="w"><h2>${t("chat")}</h2><select id="sel"><option value="">${t("pick")}</option>${items.map(x=>`<option value="${x.id}"${x.id==room?" selected":""}>${esc(ti(x))}</option>`).join("")}</select><div id="cv"></div></div>`;
$("#app").innerHTML=h;
if(!q&&route=="home")show();
if(!q&&route=="chat")setRoom(room);
if(!q&&route=="req")reqView();
if(!q&&route=="up")upView()}
function setRoom(id){cu();cu=()=>{};room=id;const v=$("#cv");if(!id){v.innerHTML="";return}
const x=items.find(i=>i.id==id);v.innerHTML=`<div class="cr"><div class="pv">${media(x)}</div><div class="ch"><div class="cl" id="ml"></div><div class="row"><input id="cn" maxlength="30" placeholder="${t("name")}" value="${esc(me)}" style="max-width:110px"><input id="ct" maxlength="300" placeholder="${t("msg")}"><button id="cs">${t("send")}</button></div></div></div>`;
const p=["rooms",id,"msgs"];cu=live($("#ml"),p);
const go=()=>{if(post(p,$("#cn").value,$("#ct").value))$("#ct").value=""};$("#cs").onclick=go;$("#ct").onkeydown=e=>{if(e.key=="Enter")go()}}
function openIt(x){
setDoc(doc(db,"views",x.id),{n:increment(1)},{merge:true}).then(()=>{views[x.id]=(views[x.id]||0)+1}).catch(()=>{});
const m=document.createElement("div");m.className="md";
m.innerHTML=`<div class="bx"><button class="x">✕</button><div class="md1">${media(x)}</div><div class="md2"><h3>${esc(ti(x))}</h3><small>${vw(x)}</small><h4>${t("cmt")}</h4><div class="cl"></div><input class="nm" maxlength="30" placeholder="${t("name")}" value="${esc(me)}"><textarea maxlength="300" rows="2" placeholder="${t("write")}"></textarea><button class="sd">${t("send")}</button><button class="dl">🚩 ${t("del")}</button></div></div>`;
document.body.appendChild(m);const p=["comments",x.id,"items"],un=live(m.querySelector(".cl"),p);
const close=()=>{un();m.remove();if(route=="videos"&&!q)render()};
m.querySelector(".dl").onclick=()=>{close();reqDlg(x.id)};m.querySelector(".x").onclick=close;m.onclick=e=>{if(e.target==m)close()};
m.querySelector(".sd").onclick=()=>{const ta=m.querySelector("textarea");if(post(p,m.querySelector(".nm").value,ta.value))ta.value=""}}
function upView(){const a=$("#app");a.innerHTML=`<div class="w"><div class="dg" style="margin:20px auto"><h3>${t("up")}</h3><input type="file" id="uf" accept="image/*,video/*"><small>${t("kind")}</small><select id="uk"><option value="p">${t("photo")}</option><option value="v">${t("video")}</option></select><small>${t("cat")}</small><select id="uc"><option value="dik">${t("dik")}</option><option value="yatay">${t("yatay")}</option><option value="normal" selected>${t("normal")}</option></select><input id="ut" maxlength="60" placeholder="${t("ctitle")}"><input id="un" maxlength="30" placeholder="${t("name")}" value="${esc(me)}"><button class="sd" id="ub">${t("upbtn")}</button><small id="us"></small></div></div>`;
const f=$("#uf"),s=$("#us");
f.onchange=()=>{const x=f.files[0];if(!x)return;const v=x.type.startsWith("video");$("#uk").value=v?"v":"p";const u=URL.createObjectURL(x),e=v?document.createElement("video"):new Image();
const r=()=>{const w=v?e.videoWidth:e.width,hh=v?e.videoHeight:e.height,k=w/hh;if(k)$("#uc").value=k<.9?"dik":k>1.2?"yatay":"normal";URL.revokeObjectURL(u)};if(v){e.preload="metadata";e.onloadedmetadata=r}else e.onload=r;e.src=u};
$("#ub").onclick=()=>{const x=f.files[0],k=$("#uk").value;if(!x)return;
if((k=="v")!=x.type.startsWith("video")){s.textContent=t("wrong");return}
if(x.size>(k=="v"?100:10)*1048576){s.textContent=t("toobig");return}
const n=$("#un").value.trim();if(n)setMe(n);
const fd=new FormData();fd.append("file",x);fd.append("upload_preset",PRESET);
const r=new XMLHttpRequest();r.open("POST",`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`);
r.upload.onprogress=e=>{s.textContent="%"+Math.round(e.loaded/e.total*100)};
r.onload=()=>{try{const d=JSON.parse(r.responseText);if(!d.secure_url)throw 0;
addDoc(collection(db,"uploads"),{type:k,url:d.secure_url,cat:$("#uc").value,title:$("#ut").value.trim()||x.name.replace(/\.[^.]+$/,"").slice(0,60),name:me||"-",ts:serverTimestamp()});
s.textContent=t("done");f.value="";$("#ut").value=""}catch(e){s.textContent=t("fail")}};
r.onerror=()=>{s.textContent=t("fail")};r.send(fd)}}
onSnapshot(query(collection(db,"uploads"),orderBy("ts","asc"),limit(500)),s=>{ups=[];s.forEach(d=>{const u=d.data();if(u.hidden)return;const v=u.type=="v";
ups.push({id:"u"+d.id,type:u.type,n:0,src:u.url,poster:v?u.url.replace("/upload/","/upload/so_0,f_jpg,w_600/").replace(/\.\w+$/,".jpg"):"",t:u.title,o:u.cat})});
rebuild();if(["videos","photos","cats"].includes(route)&&!q&&!document.querySelector(".md"))render()});
let rp="";
function reqDlg(pre){rp=pre;route="req";q="";$("#q").value="";render()}
function reqView(){const a=$("#app");a.innerHTML=`<div class="w"><div class="dg" style="margin:20px auto"><h3>${t("del")}</h3><select><option value="">${t("pick")}</option>${items.map(x=>`<option value="${x.id}"${x.id==rp?" selected":""}>${esc(ti(x))}</option>`).join("")}</select><textarea maxlength="500" rows="4" placeholder="${t("why")}"></textarea><input maxlength="30" placeholder="${t("name")}" value="${esc(me)}"><button class="sd">${t("send")}</button><small></small></div></div>`;
const g=s=>a.querySelector(s);g(".sd").onclick=()=>{const r=g("textarea").value.trim(),x=items.find(i=>i.id==g("select").value);if(!r||!x)return;
addDoc(collection(db,"requests"),{item:x.id,title:ti(x),name:g("input").value.trim()||"-",reason:r,ts:serverTimestamp()});g("small").textContent=t("sent");g("textarea").value="";rp=""}}
$("#dr").onclick=()=>reqDlg("");
$("#app").onclick=e=>{const c=e.target.closest(".card"),b=e.target.closest("[data-f],[data-c]");
if(c)openIt(items.find(x=>x.id==c.dataset.id));
else if(b){if(b.dataset.f)flt=b.dataset.f;if(b.dataset.c)cat=b.dataset.c;render()}};
$("#app").onchange=e=>{if(e.target.id=="sel")setRoom(e.target.value)};
document.querySelectorAll(".tabs a").forEach(a=>a.onclick=()=>{route=a.dataset.r;q="";$("#q").value="";render()});
document.querySelectorAll(".strip button").forEach(b=>b.onclick=()=>{localStorage.l=b.dataset.l;render()});
$("#q").oninput=e=>{q=e.target.value.trim();render()};
$("#logo").onclick=()=>{route="home";q="";$("#q").value="";render()};
$("#me").onclick=()=>{const n=prompt(t("ask"),me);if(n!==null){setMe(n);render()}};
getDocs(collection(db,"views")).then(s=>{s.forEach(d=>views[d.id]=d.data().n);render()}).catch(()=>{});
render();
</script></body></html>
