function camOpen(){
if(!A()){needAcc();return}
let st=null,face="user",blob=null,url="";
const m=document.createElement("div");m.className="md";
m.innerHTML=`<div class="cmb"><button class="x">✕</button><div class="cmv"><video playsinline muted autoplay></video><img alt="" hidden><video id="vp" controls playsinline hidden></video></div><div class="cmc"><div class="cm1" id="k1"><button class="dl" id="kf" title="${t("flip")}">🔄</button><button class="sh" id="ks" title="${t("shot")}"></button><button class="dl" id="kg" title="${t("gal")}">🖼️</button></div><div class="col" id="k2" hidden><input id="kc" maxlength="200" placeholder="${t("capph")}"><label class="tg"><input type="checkbox" id="ko">👁️ ${t("once")}</label><label class="tg"><input type="checkbox" id="kh">📖 Hikaye olarak paylaş (24 saat)</label><div class="row"><button class="dl" id="kr">↩ ${t("retake")}</button><button class="sd" id="kp" style="flex:1">${t("share")}</button></div></div><small id="kt"></small></div><input type="file" id="ki" accept="image/*,video/*" hidden><input type="file" id="kx" accept="image/*" capture="environment" hidden></div>`;
document.body.appendChild(m);
const g=s=>m.querySelector(s),v=g("video"),im=g("img"),sm=g("#kt");
const stop=()=>{if(st){st.getTracks().forEach(x=>x.stop());st=null}};
const start=async()=>{stop();
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){sm.textContent=t("nocam");return}
try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:1280},height:{ideal:1280}},audio:false});
if(!m.isConnected||blob){s.getTracks().forEach(x=>x.stop());return}
st=s;v.srcObject=s;v.classList.toggle("mir",face=="user");sm.textContent=""}catch(e){sm.textContent=t("nocam")}};
const vp=g("#vp"),setBlob=b=>{blob=b;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);const isv=b.type.startsWith("video");im.hidden=isv;vp.hidden=!isv;if(isv)vp.src=url;else im.src=url;v.hidden=true;stop();g("#k1").hidden=true;g("#k2").hidden=false;sm.textContent=""};
const close=()=>{stop();if(url)URL.revokeObjectURL(url);m.remove()};
const take=f=>{if(!f)return;const vv=f.type.startsWith("video/");if(!(vv||f.type.startsWith("image/"))||f.size>(vv?100:10)*1048576){sm.textContent=t("toobig");return}setBlob(f)};
g("#ki").onchange=e=>take(e.target.files[0]);g("#kx").onchange=e=>take(e.target.files[0]);
g("#kg").onclick=()=>g("#ki").click();
g("#kf").onclick=()=>{face=face=="user"?"environment":"user";start()};
g("#ks").onclick=()=>{
if(!st){g("#kx").click();return}
if(!v.videoWidth)return;
const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,1280/Math.max(w,h)),c=document.createElement("canvas");
c.width=Math.round(w*k);c.height=Math.round(h*k);
const x=c.getContext("2d");if(face=="user"){x.translate(c.width,0);x.scale(-1,1)}
x.drawImage(v,0,0,c.width,c.height);
c.toBlob(b=>{if(b)setBlob(b)},"image/jpeg",.85)};
g("#kr").onclick=()=>{blob=null;vp.hidden=true;vp.removeAttribute("src");im.hidden=true;v.hidden=false;g("#k1").hidden=false;g("#k2").hidden=true;g("#ki").value="";g("#kx").value="";start()};
g("#kp").onclick=async()=>{if(!blob)return;const b=g("#kp");b.disabled=true;
try{const u=await up(blob,p=>{sm.textContent="%"+p});
const vid=blob.type.startsWith("video/"),sty=g("#kh").checked;await addDoc(collection(db,sty?"stories":"posts"),sty?{uid,url:u,vid,ts:serverTimestamp()}:{uid,url:u,vid,cap:g("#kc").value.trim().slice(0,200),once:g("#ko").checked&&!vid,ts:serverTimestamp()});
close();if(sty)goUser(uid);else gotab("explore")}catch(e){sm.textContent=t("fail");b.disabled=false}};
g(".x").onclick=close;
start()}
