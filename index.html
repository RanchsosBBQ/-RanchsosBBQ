<style>
:root{--a:#00e5ff;--ink:#001417;--c:#262626;--hd:#141414;--bg:#000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}#app{flex:1;display:flex;flex-direction:column}#app>.w{width:100%;margin:0 auto;padding-bottom:40px}[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
input,textarea,select{background:var(--c);border:1px solid #333;border-radius:8px;padding:10px;min-width:0}textarea{resize:none}
.strip{background:#0a0a0a;display:flex;justify-content:flex-end;gap:6px;padding:5px 20px}
.strip button{background:none;border:0;color:#8a8a8a;font-size:12px;font-weight:700}.strip .on{color:var(--a)}
.head{background:var(--hd);border-bottom:1px solid #1f1f1f}.w{max-width:1510px;margin:auto;padding:0 20px}
.top{display:flex;align-items:center;gap:16px;padding:10px 0 6px}
.logo{font-size:36px;font-weight:700;letter-spacing:-1px;cursor:pointer;white-space:nowrap}
.logo b{background:var(--a);color:var(--ink);padding:0 7px 2px;border-radius:6px;margin-left:4px}
.search{flex:1;max-width:640px;background:var(--c);border-radius:30px;height:46px;display:flex;align-items:center;padding:0 18px}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
#me{margin-left:0;display:flex;align-items:center;gap:10px;background:none;border:0}
.av{overflow:hidden;width:42px;height:42px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;font-size:22px}
.tabs{display:flex;overflow-x:auto}.tabs a{flex:1;min-width:110px;text-align:center;padding:15px 10px;font-weight:700;font-size:12px;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs a.on{border-color:var(--a);color:var(--a)}
h2{font-size:23px;margin:18px 0 14px}
.chips{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto}
.chips button{background:#111;border:2px solid #262626;border-radius:30px;padding:11px 22px;font-weight:700;white-space:nowrap}
.chips .on{border-color:var(--a);color:var(--a)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{background:#111;border-radius:4px;overflow:hidden;cursor:pointer}.card:hover{outline:2px solid var(--a)}
.th{position:relative;height:220px;background:#000}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--a) 90%,transparent);color:var(--ink);display:grid;place-items:center;font-style:normal}
.in{padding:10px 12px}.in b{display:block;font-size:15px}.in small{color:#aaa}.em{color:#888;padding:30px 0}
.hero{position:relative;flex:1 0 auto;min-height:340px;overflow:hidden;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1.4s}
.hero img.on{opacity:1;transform:scale(1.14);transition:opacity 1.4s,transform 6s linear}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.ov h1{font-size:clamp(32px,6vw,72px);margin:0;text-shadow:0 2px 20px #000;text-align:center;padding:0 16px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:9;padding:10px}
.bx{position:relative;background:#141414;border-radius:8px;display:grid;grid-template-columns:2fr 1fr;width:min(1200px,100%);max-height:92vh;overflow:hidden}
.md1{background:#000;display:grid;place-items:center}.md1 img,.md1 video{max-width:100%;max-height:92vh}
.md2{padding:14px;display:flex;flex-direction:column;gap:8px;max-height:92vh;min-height:0}.md2 h3,.md2 h4{margin:0}
.cl{flex:1;overflow:auto;display:flex;flex-direction:column-reverse;gap:8px;min-height:120px}
.cm{background:#1f1f1f;padding:8px 10px;border-radius:8px;font-size:14px;word-break:break-word}.cm b{display:block;color:var(--a);font-size:12px}
.x{position:absolute;right:8px;top:8px;z-index:2;background:#000a;border:0;border-radius:50%;width:34px;height:34px}
.sd,#cs{background:var(--a);color:var(--ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pv img,.pv video{width:100%;max-height:62vh;object-fit:contain;background:#000}
.ch{display:flex;flex-direction:column;gap:8px;height:62vh}.row{display:flex;gap:6px}.row input{flex:1}
.dl{background:none;border:1px solid #444;border-radius:8px;padding:8px;font-size:13px;color:#ccc}
.dg{background:#141414;border-radius:8px;padding:18px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
footer a{color:var(--a);cursor:pointer}
footer{margin-top:0;padding:22px;color:#8a8a8a;font-size:13px;text-align:center;background:#141414}
@media(max-width:800px){.bx,.cr{grid-template-columns:1fr}.bx{overflow:auto}.md1 img,.md1 video{max-height:50vh}.ch{height:50vh}.logo{font-size:28px}.search{height:40px}.top{flex-wrap:wrap}.search{order:5;flex:1 1 100%;max-width:none}#me span{display:none}}
#cam{margin-left:auto;background:none;border:0;font-size:26px;padding:6px 10px;border-radius:50%;line-height:1}#cam:hover{background:#262626}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.col{display:flex;flex-direction:column;gap:10px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pc{background:#111;border-radius:8px;overflow:hidden}
.pi{position:relative;aspect-ratio:1;background:#000;cursor:pointer;display:grid;place-items:center;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:cover;display:block}
.lk{padding:18px;text-align:center;color:#aaa;font-size:14px}.lk b{display:block;font-size:34px;margin-bottom:8px}
.pm{display:flex;align-items:center;gap:6px;padding:8px 10px}
.pm .u{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;font-weight:700;font-size:14px}
.pm .u span:last-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pa{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#262626;display:inline-grid;place-items:center;flex:none;font-size:15px}
.hb{background:none;border:0;color:#ccc;font-size:15px;padding:4px 6px;border-radius:6px}.hb.on{color:#ff4d6d}
.fb{background:var(--a);color:var(--ink);border:0;border-radius:20px;padding:7px 16px;font-weight:700;font-size:13px;white-space:nowrap}.fb.on{background:#262626;color:#fff}
.cap{padding:0 12px 10px;font-size:14px;color:#ddd;word-break:break-word}
.bd{position:absolute;top:8px;left:8px;background:#000a;border-radius:12px;padding:3px 9px;font-size:12px}
.pr{display:flex;gap:22px;align-items:center;padding:24px 0;flex-wrap:wrap}
.pb{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#262626;display:grid;place-items:center;font-size:48px;flex:none}
.pb.sm{width:54px;height:54px;font-size:26px}
.st{display:flex;gap:22px;margin:8px 0}.st button{background:none;border:0;text-align:center;padding:0}.st b{display:block;font-size:20px}.st small{color:#aaa}
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.uc{background:#111;border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer}.uc:hover{outline:2px solid var(--a)}
.dg .uc{margin-bottom:6px}
.cmb{position:relative;background:#141414;border-radius:10px;width:min(460px,100%);max-height:96vh;overflow:auto;display:flex;flex-direction:column}
.cmv{position:relative;background:#000;aspect-ratio:3/4;max-height:68vh;width:100%;display:grid;place-items:center;overflow:hidden}
.cmv video,.cmv img{width:100%;height:100%;object-fit:contain}.cmv video.mir{transform:scaleX(-1)}
.cmc{padding:12px;display:flex;flex-direction:column;gap:10px}
.cm1{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.sh{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid var(--a);padding:0}.sh:active{transform:scale(.92)}
.tg{display:flex;gap:8px;align-items:center;font-size:14px}.tg input{width:18px;height:18px;padding:0}
@media(max-width:600px){.pg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pb{width:84px;height:84px;font-size:38px}.pb.sm{width:54px;height:54px;font-size:26px}}
.ib{background:none;border:0;font-size:24px;padding:6px 8px;border-radius:50%;line-height:1}.ib:hover{background:#262626}#bc{color:var(--a);font-size:12px}
.gl{box-shadow:0 0 0 2px #000,0 0 0 4px var(--a),0 0 14px 4px var(--a)!important;cursor:pointer}
.pl{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--a) 90%,transparent);color:var(--ink);display:grid;place-items:center;font-style:normal}
.prot,.prot *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.pi img{pointer-events:none}
body.blk .prot{visibility:hidden!important}
body.lk2::after{content:"🔒 Güvenlik: ekran yakalama algılandı";position:fixed;inset:0;background:#000;z-index:999;display:grid;place-items:center;font-size:22px}

/* ===== GÜZELLEŞTİRME KATMANI (sadece görünüm; JS'e dokunmaz) ===== */
:root{--r:14px;--ease:cubic-bezier(.2,.8,.2,1);--glow:color-mix(in srgb,var(--a) 35%,transparent)}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45;background:radial-gradient(1200px 500px at 50% -150px,color-mix(in srgb,var(--a) 9%,transparent),transparent),var(--bg)}
::selection{background:var(--a);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#3a3a3a;background-clip:padding-box;border:2px solid transparent}::-webkit-scrollbar-track{background:transparent}
button,.card,.uc,.thr,.tabs a,.chips button,.fb,.sd,#cs{transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease),outline-color .2s}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
input,textarea,select{border-radius:10px;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}

/* üst bar */
.head{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--hd) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.strip{background:rgba(0,0,0,.4)}
.logo b{box-shadow:0 0 18px var(--glow);transition:box-shadow .3s}.logo:hover b{box-shadow:0 0 28px var(--a)}
.search{background:rgba(255,255,255,.07);border:1px solid transparent;transition:border-color .2s,background .2s,box-shadow .2s}
.search:focus-within{background:rgba(255,255,255,.1);border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}
.search input,.search input:focus{border:0;box-shadow:none}
.av{border:2px solid rgba(255,255,255,.08);transition:border-color .2s,transform .2s}#me:hover .av{border-color:var(--a);transform:scale(1.06)}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{letter-spacing:.06em;color:#b9b9b9;border-bottom-width:3px;border-radius:3px 3px 0 0}
.tabs a:hover{color:#fff;background:rgba(255,255,255,.05)}
.tabs a.on{background:linear-gradient(to top,var(--glow),transparent 70%)}

/* başlıklar ve etiketler */
h2{font-size:24px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:1em;border-radius:3px;background:var(--a);box-shadow:0 0 12px var(--glow)}
.chips{scrollbar-width:none;padding:2px}.chips::-webkit-scrollbar{display:none}
.chips button{background:rgba(255,255,255,.04);border:1.5px solid #2a2a2a;padding:9px 20px}
.chips button:hover{border-color:#555;transform:translateY(-1px)}
.chips .on{background:var(--a);color:var(--ink);border-color:var(--a);box-shadow:0 4px 18px var(--glow)}

/* kartlar */
.g{gap:16px}.pg{gap:16px}.ug{gap:12px}
.card,.pc,.uc,.thr{border-radius:var(--r);background:linear-gradient(180deg,#171717,#0f0f0f);border:1px solid rgba(255,255,255,.06)}
.card:hover,.uc:hover,.thr:hover{outline:0;border-color:var(--a);transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px var(--a),0 8px 30px var(--glow)}
.pc{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}.pc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.th img,.pi img{transition:transform .5s var(--ease),filter .3s}.card:hover .th img,.pi:hover img{transform:scale(1.06)}
.th::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.th i,.pl{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 6px 24px var(--glow);transition:transform .25s var(--ease)}.card:hover .th i,.pi:hover .pl{transform:scale(1.12)}
.in{padding:12px 14px}.in b{font-weight:650;line-height:1.3}
.bd{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.pa,.pb{border:2px solid rgba(255,255,255,.08)}
.hb{transition:transform .15s,color .2s}.hb:hover{transform:scale(1.15)}.hb.on{text-shadow:0 0 14px rgba(255,77,109,.6)}

/* butonlar */
.fb,.sd,#cs{box-shadow:0 4px 16px var(--glow)}
.fb:hover,.sd:hover,#cs:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 8px 22px var(--glow)}
.fb:active,.sd:active,#cs:active{transform:translateY(0) scale(.97)}
.fb.on{box-shadow:none}
.dl{transition:all .2s}.dl:hover{border-color:var(--a);color:#fff}
#cam,.ib{transition:background .2s,transform .2s}#cam:hover,.ib:hover{background:rgba(255,255,255,.1);transform:scale(1.08)}

/* vitrin (hero) */
.hero{min-height:380px}
.ov{background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.7)),linear-gradient(to top,var(--bg),transparent 40%)}
.ov h1{letter-spacing:-1.5px;font-weight:800}

/* pencere (modal) */
.md{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(0,0,0,.78);animation:fi .2s ease}
.bx,.dg,.cmb{border-radius:18px;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.7);animation:pop .3s var(--ease)}
.dg,.cmb{background:linear-gradient(180deg,#1a1a1a,#121212)}
.x{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s,transform .2s}.x:hover{background:rgba(255,255,255,.2);transform:rotate(90deg)}
.cm{background:rgba(255,255,255,.06);border-radius:12px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#app>.w{animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* sohbet / DM */
.kc,.cmw{border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.kmsg{border-radius:8px;margin:0 6px;padding:3px 10px}
.kin{border:1px solid rgba(255,255,255,.06);transition:border-color .2s,box-shadow .2s}.kin:focus-within{border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}
.kin input#cht,.kin input#cht:focus{border:0;box-shadow:none}
.kimg{border-radius:12px}
.cmc{transition:background .15s}

/* profil */
.pb{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--a),0 0 24px var(--glow)}.pb.sm{box-shadow:none}
.st b{font-size:22px}.st button:hover b{color:var(--a)}
.pr{border-bottom:1px solid rgba(255,255,255,.06)}

/* alt bilgi */
footer{background:linear-gradient(180deg,transparent,rgba(255,255,255,.03));border-top:1px solid rgba(255,255,255,.06)}
.em{text-align:center;padding:50px 0;font-size:15px}

@media(max-width:600px){.g{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.th{height:150px}.in{padding:9px 10px}.in b{font-size:13.5px}h2{font-size:20px}.card:hover,.uc:hover,.thr:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
